[project]
name = "crewai_invest_reporter"
version = "0.1.0"
description = "AI-agent investment reports for the stocks and funds in your Nubank/NuInvest wallet (Open Finance)"
authors = [{ name = "Gabriel Griebeler", email = "gabrielgriebeler98@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "crewai>=1.15.28,<2",
    "defusedxml>=0.7",
    "feedparser>=6.0.0",
    "flask>=3.0",
    "lxml>=4.9.0",
    "openpyxl>=3.1",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "waitress>=3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "responses>=0.25.0",
]

[project.scripts]
crewai_invest_reporter = "crewai_invest_reporter.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]  # pt-BR text legitimately uses accented characters

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:warnings"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
